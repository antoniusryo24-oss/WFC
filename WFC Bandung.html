<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WFC Bandung — Work From Cafe</title>

  <!-- Fonts + tokens -->
  <link rel="stylesheet" href="tokens.css" />

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- React + Babel -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <style>
    #root { height: 100vh; overflow: hidden; }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Mock data (plain JS, no Babel) -->
  <script src="data.js"></script>

  <!-- Tweaks panel (must load before App) -->
  <script type="text/babel" src="tweaks-panel.jsx"></script>

  <!-- Components — load in dependency order -->
  <script type="text/babel" src="components/PlaceCard.jsx"></script>
  <script type="text/babel" src="components/Reviews.jsx"></script>
  <script type="text/babel" src="components/MenuSection.jsx"></script>
  <script type="text/babel" src="components/TopBar.jsx"></script>
  <script type="text/babel" src="components/Sidebar.jsx"></script>
  <script type="text/babel" src="components/MapView.jsx"></script>
  <script type="text/babel" src="components/DetailPanel.jsx"></script>
  <script type="text/babel" src="components/SubmissionForm.jsx"></script>
  <script type="text/babel" src="components/AdminQueue.jsx"></script>
  <script type="text/babel" src="components/LoginScreen.jsx"></script>

  <!-- Main app -->
  <script type="text/babel" src="App.jsx"></script>
</body>
</html>
